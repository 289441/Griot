# Sends any waiting alerts and due reminders every 5 minutes, the shortest GitHub allows.
# Set APP_URL and CRON_SECRET as repository secrets.
name: tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: >
          curl --fail --silent --show-error --max-time 90
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          "${{ secrets.APP_URL }}/api/cron/tick"
