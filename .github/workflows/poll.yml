# Wakes the alert bot every 15 minutes, because Vercel's free plan only runs cron once a day.
# Set ADMIN_URL and BOT_SECRET as repository secrets. Neither is ever stored in this file.
name: poll

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: >
          curl --fail --silent --show-error --max-time 90 -X POST
          -H "Authorization: Bearer ${{ secrets.BOT_SECRET }}"
          "${{ secrets.ADMIN_URL }}/api/poll"
